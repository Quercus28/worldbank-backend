spring.application.name=worldbank-backend
server.port=8080

# Base URL de la World Bank Indicators API v2 (publica, sin autenticacion, solo lectura)
worldbank.api.base-url=https://api.worldbank.org/v2

# Los BigDecimal (montos en dolares) se serializan siempre en notacion plana,
# nunca en notacion cientifica (p.ej. 1951923942083.32, no 1.95192394208332E12).
spring.jackson.serialization.write-bigdecimal-as-plain=true
