
plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.udea'
version = '0.0.1-SNAPSHOT'
description = 'Backend en capas que consume la World Bank Indicators API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    acceptance {
        java.srcDir 'src/acceptance/java'
        resources.srcDir 'src/acceptance/resources'
    }
}

configurations {
    acceptanceImplementation.extendsFrom testImplementation
    acceptanceRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    acceptanceImplementation 'com.intuit.karate:karate-junit5:1.4.1'
}

tasks.named('processAcceptanceResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('acceptanceTest', Test) {
    description = 'Pruebas de aceptación con Karate (la app debe estar corriendo en localhost:8080)'
    group = 'verification'
    testClassesDirs = sourceSets.acceptance.output.classesDirs
    classpath = sourceSets.acceptance.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.test
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

tasks.register('testUnit', Test) {
    description = 'Runs unit tests (tagged @Tag("unit")) and generates an HTML report'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'unit'
    }
    reports {
        html.outputLocation = layout.buildDirectory.dir('reports/tests/unit')
        junitXml.outputLocation = layout.buildDirectory.dir('test-results/unit')
    }
}

tasks.register('testPerformance', Test) {
    description = 'Runs performance tests (tagged @Tag("performance")) and generates an HTML report'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'performance'
    }
    reports {
        html.outputLocation = layout.buildDirectory.dir('reports/tests/performance')
        junitXml.outputLocation = layout.buildDirectory.dir('test-results/performance')
    }
    mustRunAfter tasks.testUnit
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 1.0
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "Quercus28_worldbank-backend"
        property "sonar.organization", "quercus28"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.qualitygate.wait", "true"
    }
}
